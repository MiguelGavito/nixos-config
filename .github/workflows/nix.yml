name: Nix checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  eval-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Run flake eval tests
        run: |
          nix eval --raw .#nixosConfigurations.elnavio.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.elgaleon.system.drvPath
