
# Monitor
monitor=,preferred,auto,1

# Entrada
input {
  # Multiple layouts: US, Spanish, Japanese
  kb_layout = us,es,jp
  # Switch layouts with Alt+Shift (grp:alt_shift_toggle)
  kb_options = grp:alt_shift_toggle
  follow_mouse = 1
  touchpad {
    natural_scroll = yes
  }
  sensitivity = 0
}

# General
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  layout = dwindle
}

# Decoración (sin opciones atiguas de sombras)
decoration {
  rounding = 4
  blur {
    enabled = false
    
  }
}

# Animaciones (mínimo)
animations {
  enabled = yes
}

# Layout dwindle
dwindle {
  pseudotile = yes
  preserve_split = yes
}

# Miscelánea
misc {
  force_default_wallpaper = 0
}

# Keybindings - Modkey = SUPER (WIN key)
$mainMod = SUPER

# Basic shortcuts
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, [floating] emacsclient -c
bind = $mainMod, F, togglefloating
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, P, exec, grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod ALT, P, exec, grim -g "$(slurp -d)" /tmp/screenshot.png && notify-send "Screenshot saved"

# Move/resize windows
binde = $mainMod, left, movewindow, l
binde = $mainMod, right, movewindow, r
binde = $mainMod, up, movewindow, u
binde = $mainMod, down, movewindow, d

# Move focus
bind = $mainMod CTRL, left, movefocus, l
bind = $mainMod CTRL, right, movefocus, r
bind = $mainMod CTRL, up, movefocus, u
bind = $mainMod CTRL, down, movefocus, d

# Workspace shortcuts
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
